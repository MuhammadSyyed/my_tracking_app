{% extends 'base.html' %}

{% block username %}
<div style="display: flex; align-items: center;">
  <select id="current_loc" class="dropdown" onchange="sendLocation()" style="font-size: 16px; padding: 4px 8px;">
    <option value="{{current_location}}" selected>{{current_location}}</option>
    {% for location in locations %}
    <option value="{{location}}">{{location}}</option>
    {% endfor %}

  </select>
  <p
    style="margin-left: 10px; background-color: #ffffff;color: black; font-size: 16px; padding: 4px 8px; border-radius: 5px;">
    {{username}}</p>
  <span class="material-icons-outlined" style="font-size: 24px; margin-left: 8px;">account_circle</span>
</div>
{% endblock %}

{% block title %} {{page_name|title}} {%
endblock %} {% block header %} {{page_name|upper}} {% endblock %} {% block
main%}
<style>
  .container {
    background-color: #fff;
    padding: 20px;
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    text-align: center;
  }

  .dropdown {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  .view {
    height: fit-content;
    width: fit-content;
    margin-top: 20px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #fafafa;
  }
</style>
<div class="container">
  <form id="simpleForm">
    <div class="form-group">
      <div class="combination">
        <label for="current">Current Location:</label>
        <select id="current" class="dropdown">
          {% for location in locations %}
          <option value="{{location}}">{{location}}</option>
          {% endfor %}
          <option value="{{current_location}}" selected>My Location On Map</option>
        </select>
      </div>
      <div class="combination">
        <label for="destination">Destination:</label>
        <select id="destination" class="dropdown">
          {% for location in locations %}
          <option value="{{location}}">{{location}}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <div class="combination" style="position:fixed; margin-top: 35px ;">
          <button type="button" onclick="showSelections('{{session_id}}')">
            Show Selections
          </button>
        </div>
      </div>
    </div>
  </form>
  <!-- <iframe id="viewDiv" src="about:blank" width="fit-content" height="fit-content" class="view">Your selections will appear
        here.</iframe> -->
</div>

<script>
  function showSelections(session_id) {
    const fetchMapData = async (source, destination) => {
      document.cookie = `session_id=${session_id}`;
      window.location.href = `/get_map/${source}/${destination}`;
    };

    var current = document.getElementById("current").value;
    var destination = document.getElementById("destination").value;
    fetchMapData(current, destination);
  }

</script>

{% endblock %}
